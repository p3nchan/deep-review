<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460">
  <defs>
    <style>
      text { font-family: 'Courier New', 'SF Mono', 'Menlo', 'Consolas', monospace; }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#cba000" stroke-width="0.3" opacity="0.07"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#000" opacity="0.06"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#cba000" opacity="0.5"/>
    </marker>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1200" height="460" fill="#0a0a0a"/>
  <rect width="1200" height="460" fill="url(#grid)"/>

  <!-- Background decorative pipes -->
  <line x1="0" y1="72" x2="240" y2="72" stroke="#cba000" stroke-width="1" opacity="0.05"/>
  <line x1="960" y1="108" x2="1200" y2="108" stroke="#cba000" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="370" x2="320" y2="370" stroke="#cba000" stroke-width="1" opacity="0.05"/>
  <line x1="880" y1="390" x2="1200" y2="390" stroke="#cba000" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="420" x2="140" y2="420" stroke="#cba000" stroke-width="0.8" opacity="0.035"/>
  <line x1="1060" y1="48" x2="1200" y2="48" stroke="#cba000" stroke-width="0.8" opacity="0.035"/>
  <line x1="500" y1="140" x2="700" y2="140" stroke="#cba000" stroke-width="0.5" opacity="0.03"/>

  <line x1="240" y1="0" x2="240" y2="72" stroke="#cba000" stroke-width="1" opacity="0.05"/>
  <line x1="960" y1="0" x2="960" y2="108" stroke="#cba000" stroke-width="1" opacity="0.05"/>
  <line x1="320" y1="370" x2="320" y2="460" stroke="#cba000" stroke-width="1" opacity="0.05"/>
  <line x1="880" y1="390" x2="880" y2="460" stroke="#cba000" stroke-width="1" opacity="0.05"/>
  <line x1="140" y1="420" x2="140" y2="460" stroke="#cba000" stroke-width="0.8" opacity="0.035"/>
  <line x1="1060" y1="0" x2="1060" y2="48" stroke="#cba000" stroke-width="0.8" opacity="0.035"/>

  <line x1="240" y1="72" x2="290" y2="140" stroke="#cba000" stroke-width="0.5" opacity="0.03" stroke-dasharray="6,8"/>
  <line x1="960" y1="108" x2="910" y2="140" stroke="#cba000" stroke-width="0.5" opacity="0.03" stroke-dasharray="6,8"/>

  <circle cx="240" cy="72" r="2.5" fill="#cba000" opacity="0.08"/>
  <circle cx="960" cy="108" r="2.5" fill="#cba000" opacity="0.08"/>
  <circle cx="320" cy="370" r="2.5" fill="#cba000" opacity="0.08"/>
  <circle cx="880" cy="390" r="2.5" fill="#cba000" opacity="0.08"/>
  <circle cx="140" cy="420" r="2" fill="#cba000" opacity="0.06"/>
  <circle cx="1060" cy="48" r="2" fill="#cba000" opacity="0.06"/>

  <!-- ===== TITLE AREA ===== -->
  <text x="600" y="72" text-anchor="middle" font-size="64" font-weight="bold" fill="#cba000" filter="url(#glow)" letter-spacing="10">DEEP REVIEW</text>

  <!-- Terminal cursor -->
  <rect x="880" y="42" width="4" height="40" fill="#cba000" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="600" y="104" text-anchor="middle" font-size="14" fill="#cba000" opacity="0.35" letter-spacing="4">FROM ARTICLES TO ARCHITECTURE DECISIONS</text>

  <!-- Separator -->
  <line x1="240" y1="124" x2="960" y2="124" stroke="#cba000" stroke-width="0.5" opacity="0.12"/>

  <!-- ===== INPUT: Document icon ===== -->
  <rect x="40" y="210" width="26" height="34" rx="2" stroke="#cba000" fill="none" stroke-width="1" opacity="0.3"/>
  <line x1="46" y1="221" x2="60" y2="221" stroke="#cba000" stroke-width="0.7" opacity="0.2"/>
  <line x1="46" y1="228" x2="60" y2="228" stroke="#cba000" stroke-width="0.7" opacity="0.2"/>
  <line x1="46" y1="235" x2="54" y2="235" stroke="#cba000" stroke-width="0.7" opacity="0.2"/>
  <text x="53" y="260" text-anchor="middle" font-size="8" fill="#cba000" opacity="0.2">article</text>

  <line x1="66" y1="227" x2="107" y2="232" stroke="#cba000" stroke-width="0.8" opacity="0.25" marker-end="url(#arrow)"/>

  <!-- ===== PIPELINE NODES ===== -->
  <!-- Phase labels -->
  <text x="178" y="185" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.3">PHASE 0</text>
  <text x="342" y="185" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.3">PHASE 1</text>
  <text x="506" y="185" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.3">PHASE 2</text>
  <text x="670" y="185" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.3">PHASE 3</text>
  <text x="834" y="185" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.3">PHASE 4</text>
  <text x="1015" y="185" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.3">PHASE 5</text>

  <!-- Node 0: FILTER -->
  <rect x="115" y="196" width="126" height="72" rx="4" fill="#0a0a0a" stroke="#cba000" stroke-width="1.5" filter="url(#softglow)"/>
  <text x="178" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#cba000">FILTER</text>
  <text x="178" y="246" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">Do we have</text>
  <text x="178" y="258" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">this problem?</text>

  <!-- Exit branch from FILTER -->
  <line x1="178" y1="268" x2="178" y2="300" stroke="#cba000" stroke-width="0.8" opacity="0.2" stroke-dasharray="4,4"/>
  <text x="178" y="314" text-anchor="middle" font-size="8" fill="#cba000" opacity="0.2">exit: no problem</text>

  <!-- Connection 0 to 1 -->
  <line x1="241" y1="232" x2="279" y2="232" stroke="#cba000" stroke-width="1.2" opacity="0.45" marker-end="url(#arrow)"/>
  <circle cx="260" cy="232" r="1.8" fill="#cba000" opacity="0.25"/>

  <!-- Node 1: EXTRACT -->
  <rect x="279" y="196" width="126" height="72" rx="4" fill="#0a0a0a" stroke="#cba000" stroke-width="1.5" filter="url(#softglow)"/>
  <text x="342" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#cba000">EXTRACT</text>
  <text x="342" y="246" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">Atomic claims</text>
  <text x="342" y="258" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">+ evidence type</text>

  <!-- Connection 1 to 2 -->
  <line x1="405" y1="232" x2="443" y2="232" stroke="#cba000" stroke-width="1.2" opacity="0.45" marker-end="url(#arrow)"/>
  <circle cx="424" cy="232" r="1.8" fill="#cba000" opacity="0.25"/>

  <!-- Node 2: DIFF -->
  <rect x="443" y="196" width="126" height="72" rx="4" fill="#0a0a0a" stroke="#cba000" stroke-width="1.5" filter="url(#softglow)"/>
  <text x="506" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#cba000">DIFF</text>
  <text x="506" y="246" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">Compare with</text>
  <text x="506" y="258" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">your system</text>

  <!-- Connection 2 to 3 -->
  <line x1="569" y1="232" x2="607" y2="232" stroke="#cba000" stroke-width="1.2" opacity="0.45" marker-end="url(#arrow)"/>
  <circle cx="588" cy="232" r="1.8" fill="#cba000" opacity="0.25"/>

  <!-- Node 3: ARGUE -->
  <rect x="607" y="196" width="126" height="72" rx="4" fill="#0a0a0a" stroke="#cba000" stroke-width="1.5" filter="url(#softglow)"/>
  <text x="670" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#cba000">ARGUE</text>
  <text x="670" y="246" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">Support vs.</text>
  <text x="670" y="258" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">counter-arguments</text>

  <!-- Connection 3 to 4 -->
  <line x1="733" y1="232" x2="771" y2="232" stroke="#cba000" stroke-width="1.2" opacity="0.45" marker-end="url(#arrow)"/>
  <circle cx="752" cy="232" r="1.8" fill="#cba000" opacity="0.25"/>

  <!-- Node 4: DECIDE -->
  <rect x="771" y="196" width="126" height="72" rx="4" fill="#0a0a0a" stroke="#cba000" stroke-width="1.5" filter="url(#softglow)"/>
  <text x="834" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#cba000">DECIDE</text>
  <text x="834" y="246" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">ADR-style</text>
  <text x="834" y="258" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">decision cards</text>

  <!-- Connection 4 to 5 (dashed — subagent boundary) -->
  <line x1="897" y1="232" x2="947" y2="232" stroke="#cba000" stroke-width="1" opacity="0.35" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <circle cx="914" cy="232" r="1.5" fill="#cba000" opacity="0.2"/>
  <circle cx="932" cy="232" r="1.5" fill="#cba000" opacity="0.2"/>
  <text x="922" y="220" text-anchor="middle" font-size="7" fill="#cba000" opacity="0.25" letter-spacing="1">SUBAGENT</text>

  <!-- Node 5: AUDIT (dashed border) -->
  <rect x="947" y="196" width="136" height="72" rx="4" fill="#0a0a0a" stroke="#cba000" stroke-width="1.5" stroke-dasharray="8,4" filter="url(#softglow)"/>
  <text x="1015" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#cba000">AUDIT</text>
  <text x="1015" y="246" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">Independent</text>
  <text x="1015" y="258" text-anchor="middle" font-size="9" fill="#cba000" opacity="0.4">red-flag check</text>

  <!-- Output -->
  <line x1="1083" y1="232" x2="1120" y2="232" stroke="#cba000" stroke-width="0.8" opacity="0.25" marker-end="url(#arrow)"/>
  <text x="1132" y="222" font-size="8" fill="#cba000" opacity="0.25">adopt</text>
  <text x="1132" y="234" font-size="8" fill="#cba000" opacity="0.25">experiment</text>
  <text x="1132" y="246" font-size="8" fill="#cba000" opacity="0.25">reject</text>

  <!-- ===== PRINCIPLES ===== -->
  <line x1="240" y1="350" x2="960" y2="350" stroke="#cba000" stroke-width="0.5" opacity="0.08"/>

  <text x="200" y="382" text-anchor="middle" font-size="11" fill="#cba000" opacity="0.3">No role-play</text>
  <text x="200" y="398" text-anchor="middle" font-size="8" fill="#cba000" opacity="0.18">structured argumentation</text>
  <text x="200" y="410" text-anchor="middle" font-size="8" fill="#cba000" opacity="0.18">over theatrical personas</text>

  <text x="600" y="382" text-anchor="middle" font-size="11" fill="#cba000" opacity="0.3">Separate judge</text>
  <text x="600" y="398" text-anchor="middle" font-size="8" fill="#cba000" opacity="0.18">audit runs as independent</text>
  <text x="600" y="410" text-anchor="middle" font-size="8" fill="#cba000" opacity="0.18">inference call</text>

  <text x="1000" y="382" text-anchor="middle" font-size="11" fill="#cba000" opacity="0.3">Phase 0 filter</text>
  <text x="1000" y="398" text-anchor="middle" font-size="8" fill="#cba000" opacity="0.18">most articles exit early</text>
  <text x="1000" y="410" text-anchor="middle" font-size="8" fill="#cba000" opacity="0.18">saving tokens</text>

  <!-- ===== BOTTOM PROMPT ===== -->
  <text x="60" y="444" font-size="13" fill="#cba000" opacity="0.2">&gt; deep-review &lt;paste article&gt;</text>

  <!-- ===== OVERLAYS ===== -->
  <rect width="1200" height="460" fill="url(#scanlines)" pointer-events="none"/>
  <rect width="1200" height="460" fill="url(#vignette)" pointer-events="none"/>
</svg>

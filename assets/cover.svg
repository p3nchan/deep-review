<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380">
  <defs>
    <style>
      text { font-family: 'Courier New', 'SF Mono', 'Menlo', 'Consolas', monospace; }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d4af55" stroke-width="0.3" opacity="0.07"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d4af55" opacity="0.5"/>
    </marker>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181614" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="#181614"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect width="1200" height="380" fill="url(#vignette)"/>

  <!-- Top gold accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="#d4af55" opacity="0.8"/>

  <!-- Left gold bar -->
  <rect x="60" y="80" width="4" height="100" fill="#d4af55" opacity="0.9"/>

  <!-- Title -->
  <text x="80" y="118" fill="#f5f0e8" font-size="44" font-weight="bold" letter-spacing="2">deep</text>
  <text x="80" y="168" fill="#d4af55" font-size="44" font-weight="bold" letter-spacing="2">review</text>

  <!-- Subtitle -->
  <text x="82" y="205" fill="#504840" font-size="15">From articles to architecture decisions</text>

  <!-- Pipeline visualization -->
  <!-- FILTER -->
  <rect x="420" y="80" rx="4" ry="4" width="90" height="32" fill="none" stroke="#d4af55" stroke-width="1.5"/>
  <text x="438" y="101" fill="#d4af55" font-size="12" filter="url(#glow)">FILTER</text>

  <!-- Arrow -->
  <line x1="515" y1="96" x2="548" y2="96" stroke="#504840" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- EXTRACT -->
  <rect x="555" y="80" rx="4" ry="4" width="100" height="32" fill="none" stroke="#d4af55" stroke-width="1.5"/>
  <text x="570" y="101" fill="#d4af55" font-size="12" filter="url(#glow)">EXTRACT</text>

  <!-- Arrow -->
  <line x1="660" y1="96" x2="693" y2="96" stroke="#504840" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- DIFF -->
  <rect x="700" y="80" rx="4" ry="4" width="70" height="32" fill="none" stroke="#d4af55" stroke-width="1.5"/>
  <text x="718" y="101" fill="#d4af55" font-size="12" filter="url(#glow)">DIFF</text>

  <!-- Arrow down -->
  <line x1="735" y1="116" x2="735" y2="148" stroke="#504840" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ARGUE -->
  <rect x="700" y="155" rx="4" ry="4" width="80" height="32" fill="none" stroke="#c66c52" stroke-width="1.5"/>
  <text x="718" y="176" fill="#c66c52" font-size="12">ARGUE</text>

  <!-- Arrow -->
  <line x1="785" y1="171" x2="818" y2="171" stroke="#504840" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- DECIDE -->
  <rect x="825" y="155" rx="4" ry="4" width="90" height="32" fill="none" stroke="#d4af55" stroke-width="1.5"/>
  <text x="843" y="176" fill="#d4af55" font-size="12" filter="url(#glow)">DECIDE</text>

  <!-- Arrow -->
  <line x1="920" y1="171" x2="953" y2="171" stroke="#504840" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- AUDIT -->
  <rect x="960" y="155" rx="4" ry="4" width="80" height="32" fill="none" stroke="#529e94" stroke-width="1.5"/>
  <text x="978" y="176" fill="#529e94" font-size="12">AUDIT</text>

  <!-- Exit branch from FILTER -->
  <line x1="465" y1="116" x2="465" y2="140" stroke="#504840" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="420" y="155" fill="#504840" font-size="10" opacity="0.6">exit: not relevant</text>

  <!-- Subagent indicator on AUDIT -->
  <text x="960" y="205" fill="#504840" font-size="10">subagent</text>
  <line x1="1000" y1="191" x2="1000" y2="197" stroke="#504840" stroke-width="1"/>

  <!-- Verdict boxes -->
  <rect x="420" y="240" rx="3" ry="3" width="80" height="24" fill="#529e94" opacity="0.15" stroke="#529e94" stroke-width="1"/>
  <text x="437" y="257" fill="#529e94" font-size="11">adopt</text>

  <rect x="515" y="240" rx="3" ry="3" width="110" height="24" fill="#d4af55" opacity="0.1" stroke="#d4af55" stroke-width="1"/>
  <text x="530" y="257" fill="#d4af55" font-size="11">experiment</text>

  <rect x="640" y="240" rx="3" ry="3" width="80" height="24" fill="#c66c52" opacity="0.15" stroke="#c66c52" stroke-width="1"/>
  <text x="655" y="257" fill="#c66c52" font-size="11">reject</text>

  <rect x="735" y="240" rx="3" ry="3" width="140" height="24" fill="#504840" opacity="0.15" stroke="#504840" stroke-width="1"/>
  <text x="748" y="257" fill="#504840" font-size="11">needs discussion</text>

  <!-- Description -->
  <text x="420" y="310" fill="#504840" font-size="13">Read great articles. Run structured analysis.</text>
  <text x="420" y="330" fill="#504840" font-size="13">Get clear verdicts — not gut feelings.</text>

  <!-- Author -->
  <text x="82" y="340" fill="#504840" font-size="13">penchan.co/penna</text>

  <!-- Bottom accent -->
  <rect x="0" y="377" width="1200" height="3" fill="#d4af55" opacity="0.3"/>
</svg>
